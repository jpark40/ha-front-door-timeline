capture:
  name: Capture timeline snapshot
  description: Save a timestamped snapshot unless its image bytes and label match the previous capture. Unchanged images are skipped successfully.
  fields:
    entity_id:
      name: Camera or image entity
      description: The camera or image entity to save.
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - domain:
                - camera
                - image
    label:
      name: Event label
      description: Short label shown below the image, such as motion, person, or doorbell.
      required: false
      default: motion
      selector:
        text:

cleanup:
  name: Clean up old snapshots
  description: Delete timeline snapshots older than the configured retention period.

refresh_source:
  name: Refresh and sync Eufy event image
  description: Request the SDK cover, wait up to 20 seconds, and save the available classified image directly to the timeline using its original image timestamp. Reports when no newer image arrives. Live video is not started.
  fields:
    entity_id:
      name: Eufy SDK Last event image
      required: true
      selector:
        entity:
          filter:
            - domain: image
              integration: eufy_sdk
    label:
      name: Verified image category
      description: Optional manual category when detection metadata cannot be matched. Select only after checking the source image.
      required: false
      selector:
        select:
          options:
            - person
            - package


