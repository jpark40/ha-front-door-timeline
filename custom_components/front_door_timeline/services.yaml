capture:
  name: Capture timeline snapshot
  description: Save an image or camera snapshot. Supply event_timestamp to keep one snapshot per detection and update that same file if its image changes. Without it, unchanged image bytes and labels are suppressed.
  fields:
    entity_id:
      name: Camera or image entity
      description: The camera or image entity to save.
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - domain:
                - camera
                - image
    label:
      name: Event label
      description: Short label shown below the image, such as motion, person, or doorbell.
      required: false
      default: motion
      selector:
        text:
    event_timestamp:
      name: Detection timestamp
      description: Optional timestamp from the detection event. Must include a timezone. Requires an image entity.
      required: false
      selector:
        text:

cleanup:
  name: Clean up old snapshots
  description: Delete timeline snapshots older than the configured retention period.

diagnostics:
  name: Timeline diagnostics
  description: Return the configured storage folder, saved label counts, latest dates, and Eufy entity states. This action does not capture, refresh, relabel, or delete images.
  fields:
    entity_id:
      name: Source image entity
      description: Optional source to inspect; defaults to the most recently used source or image.front_door_last_event.
      required: false
      selector:
        entity:
          filter:
            - domain: image

refresh_source:
  name: Sync Eufy Last event image
  description: In automatic mode, save image.front_door_last_event for the current relevant detection using its event type and timestamp. Does not require the image timestamp or bytes to change. Legacy manual mode can request the SDK refresh control.
  fields:
    entity_id:
      name: Eufy SDK Last event image
      required: true
      selector:
        entity:
          filter:
            - domain: image
              integration: eufy_sdk
    label:
      name: Verified image category
      description: Optional manual category when detection metadata cannot be matched. Select only after checking the source image.
      required: false
      selector:
        select:
          options:
            - person
            - package


