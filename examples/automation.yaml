# Optional manual mode only: set auto_capture: false before enabling this.
# Automatic capture in 1.0.14+ already watches these entities. Do not run both.
alias: Front Door - Save snapshots to timeline
description: Save the displayed Last event image for a relevant front-door detection.
triggers:
  - trigger: state
    entity_id: event.front_door_detection
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and
         trigger.to_state.state not in ['unknown', 'unavailable', 'none', ''] and
         trigger.to_state.attributes.get('event_type') in
           ['person', 'stranger', 'package_delivered', 'package_taken'] and
         (trigger.from_state is none or
          trigger.from_state.state != trigger.to_state.state or
          trigger.from_state.attributes.get('event_type') !=
            trigger.to_state.attributes.get('event_type')) and
         -5 <= as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0) <= 60 }}
actions:
  - action: front_door_timeline.capture
    data:
      entity_id: image.front_door_last_event
      label: "{{ trigger.to_state.attributes.event_type }}"
      event_timestamp: "{{ trigger.to_state.state }}"
mode: queued
max: 20
